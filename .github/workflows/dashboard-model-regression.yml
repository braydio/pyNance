name: Dashboard Model Regression

on:
  pull_request:
    paths:
      - "backend/app/services/dashboard_activity_status.py"
      - "backend/app/services/llm_settings.py"
      - "tests/test_dashboard_activity_status_service.py"
      - "tests/test_llm_settings_service.py"
      - ".github/workflows/dashboard-model-regression.yml"

permissions:
  contents: read

jobs:
  local-model-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install "pytest>=8,<9" "SQLAlchemy>=2,<3" "requests>=2,<3"
      - name: Check dashboard model safety and fallback
        run: python -m pytest -q tests/test_llm_settings_service.py tests/test_dashboard_activity_status_service.py
